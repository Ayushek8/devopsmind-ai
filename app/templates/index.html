<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DevOpsMind AI</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

<div class="page">

    <!-- ===================================================== -->
    <!-- Header -->
    <!-- ===================================================== -->

    <header class="header">

        <div>

            <h1>🚀 DevOpsMind AI</h1>

            <p>

                AI Powered DevOps Engineer

            </p>

        </div>

        <div class="header-right">

            <span class="badge github">

                GitHub

            </span>

            <span class="badge jenkins">

                Jenkins

            </span>

            <span class="badge aws">

                AWS

            </span>

        </div>

    </header>

    <!-- ===================================================== -->
    <!-- Prompt -->
    <!-- ===================================================== -->

    <section class="prompt-card">

        <label>

            Ask DevOpsMind

        </label>

        <textarea

            id="message"

            placeholder="Examples:

• Why did deployment fail?

• Show workflows

• Trigger deployment

• Retry latest pipeline

• Show deployment history

• Show latest failed deployment"

        ></textarea>

        <button id="execute">

            🚀 Execute

        </button>

    </section>

    <!-- ===================================================== -->
    <!-- Response -->
    <!-- ===================================================== -->

    <section class="response-card">

        <div class="response-header">

            <h2>

                Investigation Result

            </h2>

            <span id="status">

                Ready

            </span>

        </div>

        <div id="response-container">

            <div id="response">

                <div class="empty-state">

                    <div class="empty-icon">

                        🤖

                    </div>

                    <h3>

                        DevOpsMind is Ready

                    </h3>

                    <p>

                        Ask a deployment, GitHub Actions, Jenkins, Kubernetes, Docker or AWS related question to begin an investigation.

                    </p>

                </div>

            </div>

        </div>

    </section>

</div>

<script src="/static/js/app.js"></script>

</body>

</html>
